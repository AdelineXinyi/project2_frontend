<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SciSciNet — UMich Research</title>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="app">
  <header>
    <h1>UMich Research SciSciNet Analysis</h1>
  </header>

  <div class="app">
    <div class="chat-panel">
      <div class="messages" ref="messagesEl">
        <div
          v-for="(m, i) in messages"
          :key="i"
          :class="['msg', m.role, m.loading ? 'loading' : '']"
        >
          <div class="bubble">{{ m.text }}</div>
        </div>
      </div>

      <div class="suggestions">
        <p>Try asking:</p>
        <button
          class="suggestion-btn"
          v-for="s in suggestions"
          :key="s"
          @click="sendSuggestion(s)"
        >
          {{ s }}
        </button>
      </div>

      <div class="input-row">
        <input
          v-model="inputText"
          placeholder="Ask about UMich research..."
          @keydown.enter="send"
          :disabled="loading"
        />
        <button @click="send" :disabled="loading || !inputText.trim()">Send</button>
      </div>
    </div>

    <div class="viz-panel">
      <div v-if="!currentSpec" class="viz-placeholder">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M7 16l3-4 3 3 3-5"/>
        </svg>
        <span>Ask a question to see a chart</span>
      </div>

      <div v-else class="viz-card">
        <div class="viz-card-header">
          <div>{{ currentSummary }}</div>

          <div v-if="filterOptions.length > 0" class="filter-row">
            <div>
              <label>Filter chart by {{ filterFieldLabel }}:</label>
              <div class="filter-hint">Hold Cmd/Ctrl or Shift to select multiple values.</div>
            </div>

            <select
              v-model="filterValues"
              multiple
              size="6"
              @change="rerenderCurrentSpec"
            >
              <option
                v-for="v in filterOptions"
                :key="v"
                :value="v"
              >
                {{ v }}
              </option>
            </select>

            <button class="clear-filter-btn" @click="clearFilter">
              Clear
            </button>
          </div>
        </div>

        <div id="vega-container"></div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
